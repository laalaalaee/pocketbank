<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketBank widget example</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  </style>
</head>
<body>
  <h1>My site</h1>
  <p>Any page can show a PocketBank balance card. Create a <strong>read-only</strong> key
     under "API Keys" in PocketBank and paste it below.</p>

  <div id="pocketbank"></div>
  <script src="http://localhost:3000/widget.js" data-key="PASTE_READ_ONLY_KEY_HERE" data-limit="5"></script>
</body>
</html>
