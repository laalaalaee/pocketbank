<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PocketBank | Sign in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f3f4f6;
            overflow: hidden;
        }
        .marquee {
            position: absolute; top: 0; left: 0; width: 100vw; background: rgba(99,102,241,0.15); color: #fff; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.15em; padding: 12px 0; text-align: center; overflow: hidden; z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .login-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            border-radius: 1.5rem;
            padding: 56px 38px 40px 38px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 32px 0 rgba(139,92,246,0.18), 0 2px 8px rgba(0,0,0,0.12);
            border: 2.5px solid transparent;
            background-clip: padding-box;
            z-index: 1;
        }
        /* Removed gradient border for pure glass look */
        @keyframes borderAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
                    background: rgba(30, 30, 40, 0.45);
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-family: 'Orbitron', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(90deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
                    box-shadow: 0 8px 32px 0 rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.12);
            color: transparent;
        }
        .brand span { color: inherit; }
        .sub-brand {
            color: #a1a1aa;
            font-size: 0.92rem;
            margin-bottom: 38px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-weight: 700;
            font-family: 'Orbitron', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .input-group { text-align: left; margin-bottom: 22px; }
        .input-group label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: #a1a1aa; font-weight: 700; margin-bottom: 8px; }
        .input-group input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(255,255,255,0.10);
            border: 1.5px solid rgba(139,92,246,0.18);
            border-radius: 14px;
            color: #fff;
            font-size: 1.05rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
        }
        .input-group input:focus {
            border-color: #8B5CF6;
            background: rgba(139,92,246,0.08);
            box-shadow: 0 0 0 4px rgba(139,92,246,0.13);
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: linear-gradient(90deg, #8B5CF6 0%, #EC4899 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-weight: 900;
            font-size: 1.08rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            box-shadow: 0 2px 8px rgba(139,92,246,0.10);
        }
        .btn-login:hover {
            background: linear-gradient(90deg, #A78BFA 0%, #EC4899 100%);
            transform: translateY(-2px) scale(1.03);
        }
        .error-msg {
            color: #ef4444; font-size: 0.95rem; margin-bottom: 20px; font-weight: 700;
            background: rgba(239, 68, 68, 0.13); padding: 13px; border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.18);
        }
        @media (max-width: 600px) {
            .login-card {
                padding: 24px 4vw 18px 4vw;
                max-width: 98vw;
            }
            .brand { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <canvas id="particle-bg" style="position:fixed;inset:0;z-index:0;pointer-events:none;"></canvas>
    <script>
    (function(){
        const canvas = document.getElementById('particle-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        function createParticles() {
            const particleCount = Math.floor(window.innerWidth / 10);
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 3 + 0.5,
                    speedX: Math.random() * 0.5 - 0.25,
                    speedY: Math.random() * 0.5 - 0.25,
                    opacity: Math.random() * 0.5 + 0.1
                });
            }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p) => {
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x > canvas.width) p.x = 0;
                if (p.x < 0) p.x = canvas.width;
                if (p.y > canvas.height) p.y = 0;
                if (p.y < 0) p.y = canvas.height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(192, 132, 252, ${p.opacity})`;
                ctx.fill();
            });
            animationFrameId = requestAnimationFrame(animate);
        }
        window.addEventListener('resize', () => {
            resize();
            createParticles();
        });
        resize();
        createParticles();
        animate();
    })();
    </script>
    <div class="login-card">
        <div class="brand">POCKET<span>BANK</span></div>
        <div class="sub-brand">Secure Access</div>
        {% if flashes and flashes.length %}
            {% for f in flashes %}
                {% set category = f[0] %}
                {% set message = f[1] %}
                <div class="error-msg" style="
                    color: {{ '#ef4444' if category == 'error' else '#10b981' }};
                    background: {{ 'rgba(239, 68, 68, 0.1)' if category == 'error' else 'rgba(16, 185, 129, 0.12)' }};
                ">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="POST">
            <div class="input-group"><label>Username</label><input type="text" name="username" required autofocus autocomplete="off"></div>
            <div class="input-group"><label>Password</label><input type="password" name="password" required></div>
            <button type="submit" class="btn-login">Sign in</button>
        </form>
    </div>
