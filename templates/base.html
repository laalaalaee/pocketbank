<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0f; --card-bg: #14141c; --t1: #f3f4f6; --t2: #9ca3af; --accent: #6366f1; }
        body { background: var(--bg); color: var(--t1); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .topbar .brand { font-weight: 800; letter-spacing: .12em; }
        .topbar .brand span { color: var(--accent); }
        .topbar a { color: var(--t2); text-decoration: none; margin-left: 16px; }
        .topbar a:hover { color: var(--t1); }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 20px 60px; }
        .pg-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 18px; }
        .fc, .sc, .glass-panel-pro { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 18px; }
        .sc-label { color: var(--t2); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
        .sc-val { font-size: 1.5rem; font-weight: 800; }
        .nav-tabs { display: flex; gap: 8px; border: 0; }
        .tab-item { color: var(--t2); text-decoration: none; padding: 8px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); }
        .tab-item.act { color: #fff; background: rgba(99,102,241,.25); border-color: rgba(99,102,241,.5); }
        .bsec { display: none; }
        .bsec.on { display: block; }
        table { color: var(--t1) !important; --bs-table-bg: transparent; --bs-table-color: var(--t1); }
        .form-control, .form-select { background: #0e0e15; border-color: rgba(255,255,255,.15); color: var(--t1); }
        .form-control:focus, .form-select:focus { background: #0e0e15; color: var(--t1); }
        .flash { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; }
        .flash.error { background: rgba(239,68,68,.12); color: #ef4444; }
        .flash.success { background: rgba(16,185,129,.12); color: #10b981; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">AI<span>BANK</span></div>
        <div>
            <span style="color:var(--t2)">{{ session.get('display_name', '') }}</span>
            <a href="/logout">Sign out</a>
        </div>
    </div>
    <div class="wrap">
        {% for f in flashes %}
        <div class="flash {{ f[0] }}">{{ f[1] }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function sw(name, el) {
            document.querySelectorAll('.bsec').forEach(function (s) { s.classList.remove('on'); });
            var target = document.getElementById('v-' + name);
            if (target) target.classList.add('on');
            document.querySelectorAll('.tab-item').forEach(function (t) { t.classList.remove('act'); });
            if (el) el.classList.add('act');
            return false;
        }
        function toggleBal(hiddenId, visibleId, eyeId) {
            var h = document.getElementById(hiddenId), v = document.getElementById(visibleId), e = document.getElementById(eyeId);
            var hide = v.style.display !== 'none';
            v.style.display = hide ? 'none' : '';
            h.style.display = hide ? '' : 'none';
            if (e) e.className = hide ? 'bi bi-eye' : 'bi bi-eye-slash';
        }
    </script>
</body>
</html>
